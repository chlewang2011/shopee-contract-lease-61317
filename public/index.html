<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopee店鋪租賃合約</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Shopee店鋪租賃合約</h1>
        <p>填寫資料後即時產生正式列印版，資料只保存在本機瀏覽器。</p>
      </div>
      <div class="top-actions">
        <button id="saveBtn" type="button">暫存</button>
        <button id="printBtn" type="button">列印 / 存PDF</button>
        <button id="clearBtn" type="button">清空</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel form-panel" aria-label="合約資料">
        <div class="section-title">
          <strong>基本資料</strong>
          <span id="saveStatus">尚未暫存</span>
        </div>

        <div class="grid two">
          <label>甲方姓名<input data-field="partyAName" autocomplete="name" /></label>
          <label>乙方姓名<input data-field="partyBName" autocomplete="name" /></label>
          <label>租賃開始日<input data-field="startDate" type="date" /></label>
          <label>租賃結束日<input data-field="endDate" type="date" /></label>
          <label>每月租金<input data-field="rent" inputmode="numeric" placeholder="例如 5000" /></label>
          <label>店鋪數量<input data-field="storeCount" inputmode="numeric" placeholder="例如 1" /></label>
        </div>

        <div class="section-title"><strong>甲方資料</strong></div>
        <div class="grid two">
          <label>甲方身分證字號<input data-field="partyAId" autocomplete="off" /></label>
          <label>甲方電話<input data-field="partyAPhone" autocomplete="tel" /></label>
          <label class="full">甲方地址<input data-field="partyAAddress" autocomplete="street-address" /></label>
        </div>

        <div class="section-title"><strong>甲方推薦人 / 連帶保證人</strong></div>
        <div class="grid two">
          <label>推薦人姓名<input data-field="referrerName" /></label>
          <label>推薦人身分證字號<input data-field="referrerId" autocomplete="off" /></label>
        </div>

        <div class="section-title"><strong>乙方資料</strong></div>
        <div class="grid two">
          <label>乙方身分證字號<input data-field="partyBId" autocomplete="off" /></label>
          <label>乙方電話<input data-field="partyBPhone" autocomplete="tel" /></label>
          <label class="full">乙方地址<input data-field="partyBAddress" autocomplete="street-address" /></label>
        </div>

        <div class="section-title"><strong>簽約日期</strong></div>
        <div class="grid three">
          <label>民國年<input data-field="rocYear" inputmode="numeric" /></label>
          <label>月<input data-field="signMonth" inputmode="numeric" /></label>
          <label>日<input data-field="signDay" inputmode="numeric" /></label>
        </div>

        <label class="check-row">
          <input id="agreeCheck" type="checkbox" />
          <span>雙方確認已閱讀合約內容，並同意列印後親簽留存。本頁不取代法律審閱。</span>
        </label>
      </section>

      <section class="panel preview-panel" aria-label="合約預覽">
        <div class="preview-toolbar">
          <strong>合約預覽</strong>
          <span>列印時只會輸出白底合約頁</span>
        </div>
        <article id="contractDoc" class="contract-doc"></article>
      </section>
    </main>
  </body>
</html>
