<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopee店鋪租賃合約</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/signature-pad.js"></script>
    <script defer src="/signature.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <span class="eyebrow">ONLINE CONTRACT</span>
        <h1>Shopee店鋪租賃合約</h1>
        <p>雲端合約管理</p>
      </div>
      <div class="top-actions">
        <button id="saveBtn" type="button" disabled>儲存到雲端</button>
        <button id="printBtn" type="button">列印 / 存PDF</button>
        <button id="clearBtn" type="button" hidden>清空未儲存欄位</button>
        <button id="logoutBtn" type="button" hidden>登出</button>
      </div>
    </header>

    <section class="cloud-bar">
      <form id="loginForm">
        <h2 id="loginTitle">管理員登入</h2>
        <label id="userLabel">帳號<input id="loginUser" autocomplete="username" required /></label>
        <label id="passwordLabel">密碼<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <button type="submit">登入</button>
      </form>
      <div id="adminTools" hidden>
        <label>合約名稱／對象<input id="contractTitle" maxlength="120" placeholder="例如：王先生－2026 年度" /></label>
        <button id="newContractBtn">新增合約</button>
        <button id="importDraftBtn">匯入舊本機草稿</button>
        <label>雲端合約<select id="contractSelect"><option value="">選擇合約</option></select></label>
        <button id="refreshCloudBtn">重新載入</button>
        <button id="shareBtn" disabled>產生分享連結</button>
        <button id="revokeBtn" disabled>停用分享</button>
        <button id="reopenBtn" disabled>重新開放修改</button>
        <button id="completeBtn" disabled>核對完成</button>
      </div>
      <div id="shareResult" hidden>
        <label>專屬連結<input id="shareUrl" readonly /></label>
        <label>驗證碼<input id="shareCode" readonly /></label>
        <p>連結 7 天後到期。請將驗證碼與連結分開傳送；重新產生會停用舊連結。</p>
      </div>
      <p id="cloudStatus" role="status" aria-live="polite">請先登入</p>
    </section>
    <main class="layout" id="editor" hidden>
      <section class="panel form-panel" aria-label="合約資料">
        <div class="panel-head">
          <div>
            <span class="eyebrow">FORM</span>
            <h2>合約資料</h2>
          </div>
          <span id="saveStatus" class="save-status">尚未暫存</span>
        </div>

        <div class="section-title"><strong>基本資料</strong></div>
        <div class="grid two">
          <label>甲方姓名<input data-field="partyAName" autocomplete="name" /></label>
          <label>乙方姓名<input data-field="partyBName" autocomplete="name" /></label>
          <label>租賃開始日<input data-field="startDate" type="date" /></label>
          <label>租賃結束日<input data-field="endDate" type="date" /></label>
          <label>每月租金<input data-field="rent" inputmode="numeric" placeholder="例如 5000" /></label>
          <label>店鋪數量<input data-field="storeCount" inputmode="numeric" placeholder="例如 1" /></label>
        </div>

        <div class="section-title"><strong>甲方資料</strong></div>
        <div class="grid two">
          <label>甲方身分證字號<input data-field="partyAId" autocomplete="off" /></label>
          <label>甲方電話<input data-field="partyAPhone" autocomplete="tel" /></label>
          <label class="full">甲方地址<input data-field="partyAAddress" autocomplete="street-address" /></label>
        </div>

        <div class="section-title"><strong>甲方推薦人 / 連帶保證人</strong></div>
        <div class="grid two">
          <label>推薦人姓名<input data-field="referrerName" /></label>
          <label>推薦人身分證字號<input data-field="referrerId" autocomplete="off" /></label>
        </div>

        <div class="section-title"><strong>乙方資料</strong></div>
        <div class="grid two">
          <label>乙方身分證字號<input data-field="partyBId" autocomplete="off" /></label>
          <label>乙方電話<input data-field="partyBPhone" autocomplete="tel" /></label>
          <label class="full">乙方地址<input data-field="partyBAddress" autocomplete="street-address" /></label>
        </div>

        <div class="section-title"><strong>簽約日期</strong></div>
        <div class="grid three">
          <label>民國年<input data-field="rocYear" inputmode="numeric" /></label>
          <label>月<input data-field="signMonth" inputmode="numeric" /></label>
          <label>日<input data-field="signDay" inputmode="numeric" /></label>
        </div>

        <section id="signatureSection" hidden>
          <div class="section-title"><strong>乙方手寫簽名</strong></div>
          <canvas id="signatureCanvas" aria-label="乙方手寫簽名板"></canvas>
          <button id="clearSignatureBtn" type="button" title="清除簽名">清除簽名</button>
        </section>
        <label class="check-row" id="consentRow">
            <input id="agreeCheck" type="checkbox" />
          <span>乙方確認已閱讀並同意本合約內容，以本次手寫簽名簽署。</span>
        </label>
        <button id="submitContractBtn" type="button" hidden>簽署並提交</button>
      </section>

      <section class="panel preview-panel" aria-label="合約預覽">
        <div class="preview-toolbar">
          <div>
            <span class="eyebrow">PREVIEW</span>
            <strong>合約預覽</strong>
          </div>
          <span>列印時僅輸出白底正式合約</span>
        </div>
        <article id="contractDoc" class="contract-doc"></article>
      </section>
    </main>
  </body>
</html>
